name: Docker Image CI

on:
  pull_request:
    branches: ["main"]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCKER_TAG: ${{ secrets.DOCKER_USERNAME }}/${{vars.DOCKER_IMAGE}}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: setDockerTag
        run: |
          echo "$DOCKER_TAG"
          echo ${{secrets.DOCKER_TOKEN}}
      - name: Login to docker hub
        run: docker login -u ${{secrets.DOCKER_USERNAME}} --password ${{secrets.DOCKER_TOKEN}}
      - name: Build the Docker image
        run: |
          docker build . --file Dockerfile --target production --tag ${{ secrets.DOCKER_USERNAME }}/${{vars.DOCKER_IMAGE}}:1.0.1
